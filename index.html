<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeScreen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="portrait-dashboard">
    <div class="container">
        <section id="weatherWidget" class="weather-widget" data-weather="cloudy" aria-label="Weather and clock">
            <div class="weather-atmosphere" aria-hidden="true"><i class="weather-orb"></i><i class="weather-cloud cloud-one"></i><i class="weather-cloud cloud-two"></i><div class="weather-particles"></div></div>
            <div class="weather-topline"><p id="weatherLocation">Ödåkra</p><time id="dashboardDate"></time></div>
            <div class="weather-current"><div><p id="weatherTemperature" class="weather-temperature">—°</p><p id="weatherCondition" role="status">Loading weather…</p><p id="weatherHighLow">High —° · Low —°</p></div><time id="dashboardClock" class="dashboard-clock">--:--</time></div>
            <div id="weatherHourly" class="weather-hourly" aria-label="Hourly forecast"></div>
        </section>

        <main class="garage-board">
            <div id="carsContainer" class="vehicle-panels" aria-label="Vehicle overview"></div>
        </main>

        <footer class="dashboard-footer">
            <button id="settingsBtn" class="text-button" type="button">Login</button>
            <div><button id="fullscreenBtn" class="text-button" type="button">Fullscreen</button><a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Weather by Open-Meteo</a></div>
            <time id="lastUpdated" title="Vehicle data last updated" hidden>--:--</time>
        </footer>

        <!-- Inställningar Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Login & display</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <p id="connectionStatus">Checking Tibber connection...</p>
                        <div id="tibberCredentials">
                            <label for="tibberClientId">Tibber Client ID:</label>
                            <input type="text" id="tibberClientId" autocomplete="off" placeholder="Tibber Data API Client ID">
                            <label for="tibberClientSecret">Tibber Client Secret:</label>
                            <input type="password" id="tibberClientSecret" autocomplete="new-password" placeholder="Tibber Data API Client Secret">
                            <small>Credentials are stored locally on this computer, not in browser storage.</small>
                            <button id="saveTibberConfig" class="btn-save">Save credentials</button>
                        </div>
                        <a id="connectTibber" class="btn-save" href="/auth/login">Connect Tibber</a>
                    </div>
                    <div class="form-group">
                        <label for="refreshInterval">Refresh interval (seconds):</label>
                        <input type="number" id="refreshInterval" value="60" min="60" max="3600">
                    </div>
                    <form id="weatherLocationForm" class="form-group">
                        <label for="weatherCity">Weather location</label>
                        <input id="weatherCity" name="city" value="Ödåkra" required maxlength="100" autocomplete="address-level2">
                        <button class="btn-save" type="submit">Update weather</button>
                        <button id="useDeviceLocation" class="btn-save" type="button">Use my location</button>
                        <p id="weatherLocationStatus" role="status"></p>
                    </form>
                    <button id="saveSettings" class="btn-save">Save interval</button>
                </div>
            </div>
        </div>

        <!-- Laddningsindikator -->
        <div id="loadingIndicator" class="loading-indicator">
            <div class="spinner"></div>
            <p>Loading vehicle data...</p>
        </div>

        <!-- Felmeddelande -->
        <div id="errorMessage" class="error-message">
            <span class="error-icon">⚠️</span>
            <span id="errorText"></span>
        </div>
    </div>

    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
    <script type="module" src="app.js"></script>
    <script type="module" src="weather.js"></script>
</body>
</html>
